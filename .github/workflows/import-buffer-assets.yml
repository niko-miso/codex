name: Import Buffer test images
on:
  push:
    paths:
      - '.github/workflows/import-buffer-assets.yml'
permissions:
  contents: write
jobs:
  import-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download ChatGPT-generated images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p buffer-assets/2026-09-19
          curl -L --fail --retry 3 -o buffer-assets/2026-09-19/01-preparation-threads.png "https://at.adobe.com/1jt06iVooZqUmd9x"
          curl -L --fail --retry 3 -o buffer-assets/2026-09-19/02-preparation-x.png "https://at.adobe.com/Ul4CYxuG5NAfujvm"
          curl -L --fail --retry 3 -o buffer-assets/2026-09-19/03-fear-threads.png "https://at.adobe.com/cUOZSy8gJl5cxTuw"
          curl -L --fail --retry 3 -o buffer-assets/2026-09-19/04-fear-x.png "https://at.adobe.com/ruiJoNSAugtGi75N"
          curl -L --fail --retry 3 -o buffer-assets/2026-09-19/05-teamwork-threads.png "https://at.adobe.com/lHSdXD2Uw3Gjz9Ec"
          curl -L --fail --retry 3 -o buffer-assets/2026-09-19/06-teamwork-x.png "https://at.adobe.com/SDW8l0XAmREn8d2j"
      - name: Commit images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add buffer-assets/2026-09-19
          if git diff --cached --quiet; then
            echo "No image changes"
            exit 0
          fi
          git commit -m "Add Buffer test images"
          git push

# trigger second push
